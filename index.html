<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Продуктовая карточка</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet"

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="button.css">
</head>

<body>

    <main class="main">
        <div class="container">

            <div class="button">
                <button id="change-color-first-card">
                    Изменить цвет первой карточки
                </button>

                <button id="change-color-all-cards">
                    Изменить цвет всех карточек
                </button>

                <button id="go-to-google">
                    Перейти в Google
                </button>

                <button id="show-homework-message">
                    Вывод ДЗ №6
                </button>

                <button id="change-button-color">
                    Изменить цвет кнопки
                </button>
            </div>

            <h1 class="products__title">
                Выбери свой продукт
            </h1>

            <ul class="products clear-list"></ul>

        </div>
    </main>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="./homework-9.js"></script>
    <script type="module" src="./homework-10.js"></script>
