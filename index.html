<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Продуктовая карточка</title>

    <!-- Подключение шрифтов Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/button.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/modal.css">

    <!-- Отключение стандартной favicon -->
    <link rel="icon" href="data:,">
</head>

<body>

    <main class="main">

        <div class="container catalog__container">

            <h1 class="products__title js-products-title">
                Выбери свой продукт
            </h1>

            <div class="actions-panel">

                <button
                    class="btn js-change-color-btn"
                    type="button"
                >
                    Сменить цвет кнопки
                </button>

                <button
                    class="btn js-paint-card-btn"
                    type="button"
                >
                    Покрасить первую карточку
                </button>

                <button
                    class="btn js-paint-all-cards-btn"
                    type="button"
                >
                    Покрасить все карточки
                </button>

                <button
                    class="btn js-open-google-btn"
                    type="button"
                >
                    Открыть Google
                </button>

                <button
                    class="btn js-log-alert-btn"
                    type="button"
                >
                    Вывод дз №6
                </button>

            </div>

            <div class="registration">

                <button
                    id="registration-button"
                    type="button"
                >
                    Регистрация
                </button>

                <button
                    id="auth-button"
                    type="button"
                >
                    Аутентификация
                </button>

            </div>

            <ul class="products clear-list"></ul>

        </div>

    </main>

    <!-- Подвал сайта -->
    <footer class="footer">

        <div class="footer__container">

            <div class="footer__info">

                <h2 class="footer__title">
                    Product Cards
                </h2>

                <p class="footer__description">
                    У Нас Самые Лучшие Продукты Для Кожи!
                </p>

                <!-- Социальные сети -->
                <div class="footer__socials">

                    <a
                        href="https://t.me/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="footer__social"
                        aria-label="Telegram"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M21.5 3.5 18.2 20c-.25 1.17-.9 1.46-1.82.91l-5.02-3.7-2.42 2.33c-.27.27-.5.5-1.03.5l.37-5.11 9.3-8.4c.4-.37-.09-.57-.62-.2L5.47 13.37.52 11.82c-1.08-.34-1.1-1.08.23-1.59L20.1 2.6c.91-.34 1.71.2 1.4.9Z"
                            />
                        </svg>
                    </a>

                    <a
                        href="https://vk.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="footer__social"
                        aria-label="ВКонтакте"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M13.1 17.2c-5.7 0-9-3.9-9.1-10.4h2.9c.1 4.7 2.1 6.7 3.7 7.1V6.8h2.7v4.1c1.5-.2 3.1-2 3.6-4.1h2.7c-.4 2.5-2 4.3-3.2 5 1.2.6 3.1 2.2 3.9 5.4h-3c-.5-2-1.9-3.5-4-3.8v3.8h-.2Z"
                            />
                        </svg>
                    </a>

                </div>

            </div>

            <!-- Подписка на рассылку -->
            <div class="footer__subscribe">

                <h2 class="footer__subscribe-title">
                    Подпишись на наши акции:
                </h2>

                <form
                    class="footer__form"
                    id="footer-form"
                >

                    <label
                        for="email"
                        class="footer__label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="footer__input"
                        placeholder="Введи Email..."
                        title="Введите корректный адрес электронной почты"
                        required
                    >

                    <span class="footer__divider"></span>

                    <button
                        type="submit"
                        class="footer__button"
                    >
                        Подписаться
                    </button>

                </form>

            </div>

            <!-- Навигация -->
            <nav class="footer__navigation">

                <h2 class="footer__navigation-title">
                    Быстрые ссылки
                </h2>

                <ul class="footer__links">

                    <li>
                        <a href="#">
                            Главная
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Магазин
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Контакты
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

        <div class="footer__bottom">

            <span class="footer__line"></span>

            <p class="footer__copyright">
                www.product-cards.com © All rights reserved
            </p>

        </div>

    </footer>

    <!-- Единый общий оверлей для всех модальных окон -->
    <div class="overlay" id="overlay"></div>

    <!-- Модальное окно регистрации -->
    <div
        class="modal"
        id="registration-modal"
    >

        <div class="modal__content">

            <button
                class="modal__close"
                type="button"
                aria-label="Закрыть окно"
            >
                ×
            </button>

            <h2 class="modal__title">
                Регистрация
            </h2>

            <form
                class="registration__form"
                id="registration-form"
            >

                <label for="name">
                    Имя
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Введите имя"
                    pattern="[А-ЯЁ][а-яё]+"
                    title="Имя должно начинаться с заглавной русской буквы и содержать только русские буквы, например Иван"
                    required
                >

                <label for="surname">
                    Фамилия
                </label>

                <input
                    type="text"
                    id="surname"
                    name="surname"
                    placeholder="Введите фамилию"
                    pattern="[А-ЯЁ][а-яё]+"
                    title="Фамилия должна начинаться с заглавной русской буквы и содержать только русские буквы, например Иванов"
                    required
                >

                <label for="birth-date">
                    Дата рождения
                </label>

                <input
                    type="date"
                    id="birth-date"
                    name="birthDate"
                    required
                >

                <label for="login">
                    Логин
                </label>

                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Введите логин"
                    minlength="3"
                    pattern="[A-Za-z0-9_]+"
                    title="Логин должен содержать минимум 3 символа: латинские буквы, цифры или _"
                    required
                >

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    minlength="8"
                    pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)[A-Za-z\d]{8,}"
                    title="Пароль должен содержать минимум 8 символов, заглавную букву, строчную букву и цифру"
                    required
                >

                <label for="password-repeat">
                    Повторите пароль
                </label>

                <input
                    type="password"
                    id="password-repeat"
                    name="passwordRepeat"
                    placeholder="Повторите пароль"
                    title="Пароли должны совпадать"
                    required
                >

                <button
                    type="submit"
                    class="registration__submit"
                >
                    Зарегистрироваться
                </button>

            </form>

        </div>

    </div>

    <!-- Модальное окно аутентификации -->
    <div
        class="modal"
        id="auth-modal"
    >

        <div class="modal__content">

            <button
                class="modal__close"
                type="button"
                aria-label="Закрыть окно"
            >
                ×
            </button>

            <h2 class="modal__title">
                Аутентификация
            </h2>

            <form
                class="registration__form"
                id="auth-form"
            >

                <label for="auth-login">
                    Логин
                </label>

                <input
                    type="text"
                    id="auth-login"
                    name="login"
                    placeholder="Введите логин"
                    required
                >

                <label for="auth-password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="auth-password"
                    name="password"
                    placeholder="Введите пароль"
                    required
                >

                <button
                    type="submit"
                    class="registration__submit"
                >
                    Войти
                </button>

            </form>

        </div>

    </div>

    <!-- Подключение JavaScript -->
    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
